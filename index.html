<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI2ch</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#008000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI2ch">

<style>
body{background:#efefef;color:#000;font-family:"MS PGothic","IPAMonaPGothic","Mona",monospace;font-size:15px;margin:0;padding:10px 10px 70px}
.t{color:#f00;font-size:20px;font-weight:bold;margin:12px 0}
.r{margin:14px 0}
.hd{color:#080}
.n{color:#080;font-weight:bold}
.b{margin:3px 0 0 24px;white-space:pre-wrap;line-height:1.45;word-break:break-all}
.a{color:#00e;text-decoration:underline}
.new{animation:f .6s}
@keyframes f{from{background:#ffd}to{background:transparent}}
input,button{font-size:14px;margin:2px}
#title{width:60%}
small{color:#666}
#post{position:sticky;bottom:0;background:#efefef;padding:8px 0;border-top:1px solid #bbb}
#msg{width:72%}
.no{cursor:pointer}
#st{color:#666;margin:8px 0}
@media (prefers-reduced-motion:reduce){.new{animation:none}}
</style></head><body>
<div>
<input id="title" placeholder="スレタイ">
<button id="go" onclick="AI2.start()">スレ立て</button>
<button onclick="AI2.stop()">止める</button>
</div>
<small>5秒に1レス流れる</small>
<div id="st"></div>
<div id="out"></div>
<div id="post"><input id="msg" placeholder="書き込む(番号タップで安価)" onkeydown="if(event.key==='Enter')AI2.post()"><button onclick="AI2.post()">書き込む</button></div>

<script>
(() => {
const KEY = 'AQ.Ab8RN6JTn1S2dQuQWJjTk-MaawPWJfMZRHpeRBF4OhDDOvIs-A'; // 捨てキー、漏れて当然
const MODEL = 'gemini-flash-lite-latest';
const INTERVAL = 5000;   // 1レスの間隔(ms)
const BATCH = 25;        // 1回のAPI呼び出しで作るレス数
const MAX_POSTS = 100;   // 枠節約の上限

const SYSTEM = `あなたは5ch「なんでも実況J(なんJ)」の住民たちを演じる脚本家。
与えられたスレタイと直前の流れに続く書き込みを、指定の件数ぶん書く。

【住民(whoは0〜7の番号)】
0 イッチ(スレ主): 一人称「ワイ」。釣られるとムキになる。「イッチ」と呼ばれる。
1 煽り屋: 「〜やんけ」「で？」「ほーん」「草」。短文で冷笑し、すぐ論破しようとする。
2 解説ニキ: 「〜やで」「〜なんよ」。妙に詳しく淡々と補足する。語尾はそっけない。
3 ネタ師: 大喜利のように比喩・パロディ・ミームで返す。「〜してる場合かー!」等。
4 即レス勢: 「乙」「それな」「せやな」「>>○○ ほんこれ」だけで済ます。1行。
5 老害: 「昔はなぁ」と脱線し、5chの歴史や過去スレを語る。「最近の若いのは」。
6 AA職人: 時々顔文字・AAを出す。(´・ω・｀) (ﾟ∀ﾟ) ｷﾀ━━━(ﾟ∀ﾟ)━━━!! 等。
7 ニュー速民: 「〜ンゴ」「〜ンゴねぇ」「草ァ！」「ファッ!?」「やめたらこの仕事」系の語尾。

【文体ルール】
- 1レスは1〜3行、長くても60字前後。解説ニキだけ最大4行。
- 笑いは「草」「ｗ」「ワロタ」「大草原」を使い分け、同じ語を3レス以内に繰り返さない。
- 「ｗ」「ｗｗｗ」は全角、語尾は「〜やん」「〜やろ」「〜ンゴ」「〜やで」「〜やな」。
- 感嘆: 「ファッ!?」「ええぇ…(困惑)」「ンゴォ…」「なお」「(ヽ´ω｀)」。
- 句読点は少なめ、「、」「。」より改行や空白で区切る。
- 約3割のレスは安価(>>数字)を付ける。数字は「今ある最後のレス番号以下」だけ。
  複数の安価(>>3 >>5)や範囲(>>2-4)も混ぜる。
- 安価への返しは相手の発言を拾ってツッコむ、乗る、ズラすのどれか。
- 流れ: 最初は反応と軽い煽り → 中盤に豆知識や議論 → 後半は脱線(関係ない昔話・別の話題・ネタ合戦)。
- 同じ住民が3レス連続で出ない。短い即レス(乙/それな)は全体の1割まで。
- 実在の個人への誹謗中傷、差別、個人情報、過度に露骨な表現は書かない。

【出力】
次のJSON配列のみ。説明やコードフェンスは付けない。
[{"who":0,"text":"本文"}]`;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pad = n => String(n).padStart(2,'0');
const CH = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const rid = () => Array.from({length:8}, () => CH[Math.random()*62|0]).join('');
const WD = '日月火水木金土';

let ids = [], queue = [], shown = [], title = '', timer = null, fetching = false, gen = 0, ended = false;

function stamp(t){
  return `${t.getFullYear()}/${pad(t.getMonth()+1)}/${pad(t.getDate())}(${WD[t.getDay()]}) `
    + `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}.${pad(Math.random()*100|0)}`;
}

function setStatus(s){ $('st').textContent = s; }

const MODELS = [MODEL, 'gemini-flash-latest', 'gemini-2.0-flash'];

async function callApi(prompt, model, level){
  // level 0: 全部入り / 1: temperature・thinking無し / 2: さらにsystemInstruction・JSON指定も無し
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
  const body = {contents:[{role:'user', parts:[{text: level >= 2 ? SYSTEM + '\n\n' + prompt : prompt}]}]};
  if(level < 2) body.systemInstruction = {parts:[{text:SYSTEM}]};
  const gc = {};
  if(level < 2) gc.responseMimeType = 'application/json';
  if(level < 1){ gc.temperature = 1.1; gc.thinkingConfig = {thinkingBudget:0}; }
  if(Object.keys(gc).length) body.generationConfig = gc;
  const res = await fetch(url, {method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':KEY},
    body:JSON.stringify(body)});
  const data = await res.json().catch(() => ({}));
  return {res, data};
}

async function callWithFallback(prompt){
  let last = null;
  for(const model of MODELS){
    for(let level = 0; level <= 2; level++){
      const r = await callApi(prompt, model, level);
      if(r.res.ok) return r;
      last = {...r, model, level};
      if(r.res.status !== 400 && r.res.status !== 404) return last;  // 400/404以外は即終了
      if(r.res.status === 404) break;                                 // モデル違い→次のモデルへ
    }
  }
  return last;
}

async function fetchBatch(note){
  const myGen = gen;
  fetching = true;
  const last = shown.slice(-12).map(p => `${p.no}[${p.who<0?'ユーザー':p.who}] ${p.text}`).join('\n');
  const prompt = `スレタイ: ${title}\n`
    + (shown.length ? `今あるレスは${shown.length}番まで。直前の流れ:\n${last}\n\n`
                      + (note || '') + `${shown.length+1}番から${BATCH}件、続きを書け。`
                    : `1番から${BATCH}件書け。1番はwho=0のイッチによる >>1 の本文(スレ立て時のひとこと)。`);
  try{
    if(KEY === 'ここにキー') throw new Error('index.htmlの KEY にAPIキーを入れてな');
    const r = await callWithFallback(prompt);
    if(!r.res.ok){
      if(r.res.status === 429) throw new Error('枠切れ。時間置いてな');
      const e = r.data.error || {};
      throw new Error(`${e.message || r.res.status}${e.status ? ' ('+e.status+')' : ''} [${r.model}/L${r.level}]`);
    }
    const part = r.data.candidates && r.data.candidates[0] && r.data.candidates[0].content
                 && r.data.candidates[0].content.parts && r.data.candidates[0].content.parts[0];
    if(!part || !part.text) throw new Error('空の応答(フィルタかも)。もう一回やってみて');
    let txt = part.text.replace(/```json|```/g,'').trim();
    txt = txt.slice(txt.indexOf('['), txt.lastIndexOf(']')+1);
    const arr = JSON.parse(txt);
    if(myGen !== gen) return;
    arr.forEach(p => { if(p && p.text) queue.push({who: Math.min(7, Math.max(0, p.who|0)), text: String(p.text)}); });
  }catch(e){
    if(myGen === gen){ setStatus('エラー: ' + e.message); stopThread(true); }
  }finally{
    if(myGen === gen) fetching = false;
  }
}

function addPost(p){
  const no = shown.length + 1;
  shown.push({no, who:p.who, text:p.text});
  const body = esc(p.text).replace(/&gt;&gt;(\d+)(-\d+)?/g, '<span class="a">&gt;&gt;$1$2</span>');
  const id = ids[p.who < 0 ? 8 : p.who];
  const div = document.createElement('div');
  div.className = 'r new';
  div.innerHTML = `<div class="hd"><span class="no" data-no="${no}">${no}</span> <span class="n">風吹けば名無し</span>：${stamp(new Date())} ID:${id}0</div><div class="b">${body}</div>`;
  $('out').appendChild(div);
  window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
  setStatus(`${no}レス`);
  return no;
}

function tick(){
  if(queue.length < 6 && !fetching && shown.length + queue.length < MAX_POSTS) fetchBatch();
  if(!queue.length){
    if(shown.length >= MAX_POSTS) return finish();
    setStatus(fetching ? '書き込み中…' : '');
    return;
  }
  const p = queue.shift();
  const no = addPost(p);
  if(no >= MAX_POSTS) finish();
}

function userPost(){
  const text = $('msg').value.trim();
  if(!text) return;
  if(!title) return alert('先にスレ立てしてな');
  if(ended) return alert('このスレは終了や');
  const no = addPost({who:-1, text});
  $('msg').value = '';
  // 先読み分を捨てて、書き込みに反応する続きを作り直す
  gen++; fetching = false; queue = [];
  fetchBatch(`たった今、ユーザーが${no}番に書き込んだ。次の数レスはその書き込み(>>${no})に反応すること(安価を付けて拾う、ツッコむ、乗る、煽る)。その後は流れに戻る。\n`)
    .then(() => { if(!timer && !ended && queue.length) timer = setInterval(tick, INTERVAL); });
}

function finish(){
  clearInterval(timer); timer = null; ended = true;
  setStatus(`${shown.length}レスでこのスレは終了や。お疲れ`);
}

function stopThread(keepMsg){
  clearInterval(timer); timer = null;
  if(!keepMsg) setStatus(`停止中(${shown.length}レス)`);
}

function startThread(){
  const t = $('title').value.trim();
  if(!t) return alert('スレタイを入れてな');
  stopThread(true); gen++;
  title = t; shown = []; queue = []; fetching = false; ended = false;
  ids = Array.from({length:9}, rid);
  $('out').innerHTML = `<div class="t">${esc(title)}</div>`;
  setStatus('スレ立て中…');
  fetchBatch().then(() => {
    if(!queue.length) return;
    tick();
    timer = setInterval(tick, INTERVAL);
  });
}
if('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
$('out').addEventListener('click', e => { const n = e.target.dataset && e.target.dataset.no; if(n){ const m = $('msg'); m.value += '>>' + n + ' '; m.focus(); } });
window.AI2 = {start:startThread, stop:() => stopThread(), post:userPost};
})();
</script>
</body></html>
